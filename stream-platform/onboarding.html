<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get started · Teach by Learning</title>
  <script src="auth-guard.js?v=3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="habits.css?v=5" />
</head>
<body class="habits-page">
  <!-- Minimal top bar: no app nav until onboarding is done -->
  <header class="topnav">
    <div class="topnav__left">
      <span class="logo ob-brand" aria-label="Teach by Learning">
        <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 14 14)">
            <path d="M11 17V1a3 3 0 0 1 6 0v16Z"/><path d="M11 12h6"/>
            <path d="M14 1.5v6.5"/><circle cx="14" cy="8.8" r=".8"/>
            <path d="M11 17l1 4h4l1-4"/><path d="M12 21v3q0 3 2 6 2-3 2-6v-3"/>
            <circle cx="14" cy="24.4" r=".8"/><path d="M14 25.4V29"/>
          </g>
        </svg>
        <span>Teach by Learning</span>
      </span>
    </div>
    <div class="topnav__right"></div>
  </header>

  <main class="ob">
    <ol class="ob__progress" id="obProgress" aria-label="Setup steps">
      <li data-n="1">Skills</li>
      <li data-n="2">Commitment</li>
      <li data-n="3">Reminders</li>
    </ol>
    <div id="obMain" aria-live="polite"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="skills.js?v=4"></script>
  <script src="habits.js?v=7"></script>
  <script src="onboarding.js?v=5"></script>
</body>
</html>
