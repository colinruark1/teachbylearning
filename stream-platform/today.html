<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today · Teach by Learning</title>
  <script src="auth-guard.js?v=3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="habits.css?v=2" />
</head>
<body class="habits-page">
  <!-- Top navigation -->
  <header class="topnav">
    <div class="topnav__left">
      <a class="logo" href="index.html" aria-label="Home">
        <!-- Vintage fountain pen, drawn upright then tilted 45° -->
        <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 14 14)">
            <path d="M11 17V1a3 3 0 0 1 6 0v16Z"/><path d="M11 12h6"/>
            <path d="M14 1.5v6.5"/><circle cx="14" cy="8.8" r=".8"/>
            <path d="M11 17l1 4h4l1-4"/><path d="M12 21v3q0 3 2 6 2-3 2-6v-3"/>
            <circle cx="14" cy="24.4" r=".8"/><path d="M14 25.4V29"/>
          </g>
        </svg>
      </a>
      <nav class="topnav__links">
        <a href="today.html" class="topnav__link is-active">Today</a>
        <a href="index.html" class="topnav__link">Browse</a>
        <a href="learn.html" class="topnav__link">Learn</a>
      </nav>
    </div>

    <div class="topnav__right">
      <a class="btn btn--secondary" href="../index.html#login">Log In</a>
      <a class="btn btn--primary" href="../index.html#signup">Sign Up</a>
    </div>
  </header>

  <main class="today">
    <header class="today__head">
      <div>
        <p class="eyebrow" id="todayDate"></p>
        <h1 class="today__title">Today</h1>
      </div>
      <ul class="today__stats" id="todayStats"></ul>
    </header>

    <div class="today__cols">
      <div class="today__main">
        <section aria-labelledby="sessionsTitle">
          <h2 class="today__h2" id="sessionsTitle">Your sessions</h2>
          <div class="habit-cards" id="habitCards"><p class="muted">Loading…</p></div>
        </section>
        <section aria-labelledby="logTitle">
          <h2 class="today__h2" id="logTitle">Your log</h2>
          <div class="log-list" id="logList"></div>
        </section>
      </div>

      <aside class="today__aside">
        <section class="panel" aria-labelledby="remindTitle">
          <h2 class="panel__title" id="remindTitle">Reminders</h2>
          <p class="muted">A text before each session, and a check-in afterward if you haven't logged it.</p>
          <div class="phone-box" id="phonePanel"></div>
        </section>
        <section class="panel" aria-labelledby="commitTitle">
          <h2 class="panel__title" id="commitTitle">Your commitments</h2>
          <ul class="commit-list" id="commitList"></ul>
          <a class="link-btn" href="onboarding.html">Edit commitments</a>
        </section>
      </aside>
    </div>
  </main>

  <input type="file" id="photoInput" accept="image/*" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="skills.js?v=3"></script>
  <script src="habits.js?v=2"></script>
  <script src="today.js?v=2"></script>
</body>
</html>
