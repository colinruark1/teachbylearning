<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream Platform</title>
  <script src="auth-guard.js?v=3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <!-- Top navigation -->
  <header class="topnav">
    <div class="topnav__left">
      <a class="logo" href="communities.html" aria-label="Home">
        <!-- Vintage fountain pen, drawn upright then tilted 45° -->
        <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 14 14)">
            <path d="M11 17V1a3 3 0 0 1 6 0v16Z"/>        <!-- cap + barrel -->
            <path d="M11 12h6"/>                           <!-- cap band -->
            <path d="M14 1.5v6.5"/><circle cx="14" cy="8.8" r=".8"/> <!-- clip -->
            <path d="M11 17l1 4h4l1-4"/>                   <!-- grip section -->
            <path d="M12 21v3q0 3 2 6 2-3 2-6v-3"/>        <!-- nib -->
            <circle cx="14" cy="24.4" r=".8"/>             <!-- breather hole -->
            <path d="M14 25.4V29"/>                        <!-- nib slit -->
          </g>
        </svg>
      </a>
      <nav class="topnav__links">
        <a href="#" class="topnav__link">Following</a>
        <a href="today.html" class="topnav__link">Today</a>
        <a href="communities.html" class="topnav__link">Communities</a>
      </nav>
      <button class="icon-btn" aria-label="More">
        <svg viewBox="0 0 20 20" width="20" height="20"><circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/></svg>
      </button>
    </div>

    <form class="search" role="search" onsubmit="return false">
      <input type="search" placeholder="Search" aria-label="Search" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 20 20" width="20" height="20"><path d="M13.2 14.6a7 7 0 1 1 1.4-1.4l4.1 4.1-1.4 1.4-4.1-4.1ZM14 9a5 5 0 1 0-10 0 5 5 0 0 0 10 0Z"/></svg>
      </button>
    </form>

    <div class="topnav__right">
      <a class="btn btn--secondary" href="../index.html#login">Log In</a>
      <a class="btn btn--primary" href="../index.html#signup">Sign Up</a>
      <button class="icon-btn avatar-btn" aria-label="User menu">
        <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0H3Z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Side navigation -->
    <aside class="sidenav" id="sidenav">
      <div class="sidenav__header">
        <h2 class="sidenav__title">Recommended Channels</h2>
        <button class="icon-btn" id="collapseBtn" aria-label="Collapse side nav">
          <svg viewBox="0 0 20 20" width="20" height="20"><path d="M4 16V4H2v12h2Zm9-1.5L14.5 13 11.5 10l3-3L13 5.5 8.5 10l4.5 4.5Z"/></svg>
        </button>
      </div>
      <ul class="channel-list" id="channelList"></ul>
      <button class="sidenav__more" id="showMore">Show More</button>
    </aside>

    <!-- Main content -->
    <main class="main">
      <section class="hero" aria-label="Featured streams">
        <button class="hero__arrow hero__arrow--prev" id="heroPrev" aria-label="Previous">
          <svg viewBox="0 0 20 20" width="20" height="20"><path d="M13.5 14.5 9 10l4.5-4.5L12 4l-6 6 6 6 1.5-1.5Z"/></svg>
        </button>
        <div class="hero__stage" id="heroStage"></div>
        <button class="hero__arrow hero__arrow--next" id="heroNext" aria-label="Next">
          <svg viewBox="0 0 20 20" width="20" height="20"><path d="M6.5 5.5 11 10l-4.5 4.5L8 16l6-6-6-6-1.5 1.5Z"/></svg>
        </button>
      </section>

      <section class="shelf">
        <h2 class="shelf__title"><a href="#">Live channels</a> we think you'll like</h2>
        <div class="stream-grid" id="liveGrid"></div>
        <div class="shelf__divider"><button>Show more</button></div>
      </section>

      <section class="shelf">
        <h2 class="shelf__title"><a href="#">Categories</a> we think you'll like</h2>
        <div class="category-grid" id="categoryGrid"></div>
        <div class="shelf__divider"><button>Show more</button></div>
      </section>

      <section class="shelf">
        <h2 class="shelf__title"><a href="communities.html">Communities</a> learning together</h2>
        <div class="skill-grid" id="skillGrid"></div>
        <div class="shelf__divider"><a href="communities.html">See all communities</a></div>
      </section>

      <section class="shelf">
        <h2 class="shelf__title"><a href="#">Just Chatting</a></h2>
        <div class="stream-grid" id="chatGrid"></div>
        <div class="shelf__divider"><button>Show more</button></div>
      </section>
    </main>
  </div>

  <script src="skills.js?v=4"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
