<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Teach by Learning</title>
  <meta name="robots" content="noindex" />
  <script src="auth-guard.js?v=3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="habits.css?v=4" />
  <link rel="stylesheet" href="admin.css?v=3" />
</head>
<body class="habits-page">
  <header class="topnav">
    <div class="topnav__left">
      <a class="logo" href="communities.html" aria-label="Home">
        <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 14 14)">
            <path d="M11 17V1a3 3 0 0 1 6 0v16Z"/><path d="M11 12h6"/>
            <path d="M14 1.5v6.5"/><circle cx="14" cy="8.8" r=".8"/>
            <path d="M11 17l1 4h4l1-4"/><path d="M12 21v3q0 3 2 6 2-3 2-6v-3"/>
            <circle cx="14" cy="24.4" r=".8"/><path d="M14 25.4V29"/>
          </g>
        </svg>
      </a>
      <nav class="topnav__links">
        <a href="today.html" class="topnav__link">Today</a>
        <a href="communities.html" class="topnav__link">Communities</a>
      </nav>
    </div>
    <div class="topnav__right"></div>
  </header>

  <main class="admin">
    <header class="admin__head">
      <div>
        <p class="eyebrow">Admin</p>
        <h1 class="today__title">Dashboard</h1>
      </div>
      <div class="admin__refresh">
        <span class="muted" id="updatedAt"></span>
        <button type="button" class="btn btn--secondary" id="refreshBtn">Refresh</button>
      </div>
    </header>

    <ul class="admin-stats" id="stats" aria-label="Summary"></ul>

    <section class="admin__section" aria-labelledby="healthTitle">
      <div class="admin__section-head">
        <h2 class="today__h2" id="healthTitle">APIs &amp; integrations</h2>
        <p class="muted" id="healthSummary"></p>
      </div>
      <ul class="health" id="health"></ul>
    </section>

    <section class="admin__section" aria-labelledby="usersTitle">
      <div class="admin__section-head">
        <h2 class="today__h2" id="usersTitle">New users</h2>
        <div class="admin__filters">
          <select class="field" id="rangeSel" aria-label="Signed up">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="all">All time</option>
          </select>
          <input class="field" id="searchInput" type="search" placeholder="Search name, email, phone" aria-label="Search users" />
          <button type="button" class="btn btn--secondary" id="copyEmails">Copy emails</button>
        </div>
      </div>
      <div class="user-table-wrap">
        <table class="user-table">
          <thead>
            <tr><th>User</th><th>Contact</th><th>Signed up</th><th>Setup</th><th>Practicing</th><th>Activity</th></tr>
          </thead>
          <tbody id="userRows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="skills.js?v=4"></script>
  <script src="habits.js?v=7"></script>
  <script src="admin.js?v=3"></script>
</body>
</html>
